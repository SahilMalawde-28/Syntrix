- name: Add user to group
  hosts: all

  tasks:
    # --- LINUX TASKS ---
    - name: Ensure group exists (Linux)
      ansible.builtin.group:
        name: "{{ group }}"
        state: present
      become: yes
      when: ansible_facts['os_family'] != "Windows"

    - name: Add user to group (Linux)
      ansible.builtin.user:
        name: "{{ user }}"
        groups: "{{ group }}"
        append: yes
      become: yes
      when: ansible_facts['os_family'] != "Windows"

    # --- WINDOWS TASKS (No become needed) ---
    - name: Ensure group exists (Windows)
      ansible.windows.win_group:
        name: "{{ group }}"
        state: present
      when: ansible_facts['os_family'] == "Windows"

    - name: Add user to group (Windows)
      ansible.windows.win_group_membership:
        name: "{{ group }}"
        members:
          - "{{ user }}"
        state: present
      when: ansible_facts['os_family'] == "Windows"
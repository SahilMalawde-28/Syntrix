- name: Provision New Machine
  hosts: "{{ target_hosts }}"
  become: yes

  tasks:

    # STEP 1 — SOFTWARE
    - name: Install base packages
      include_tasks: ../primitives/install_package.yml
      vars:
        package_name: "{{ provision_package_name | default('vim') }}"

    # STEP 2 — IDENTITY
    - name: Create group
      include_tasks: ../primitives/create_group.yml
      vars:
        group: "{{ provision_group | default('labusers') }}"

    - name: Create user
      include_tasks: ../primitives/create_user.yml
      vars:
        user: "{{ provision_user }}"

    - name: Add user to group
      include_tasks: ../primitives/add_to_group.yml
      vars:
        user: "{{ provision_user }}"
        group: "{{ provision_group | default('labusers') }}"

    # STEP 3 — NETWORK
    - name: Set hostname
      hostname:
        name: "{{ provision_hostname }}"
      when:
        - provision_hostname is defined
        - provision_hostname != ""
        - inventory_hostname != "localhost"
        - not safe_mode | default(true)

    - name: Configure DNS
      include_tasks: ../primitives/configure_network.yml
      vars:
        dns_server: "{{ provision_dns_server }}"
      when:
        - provision_dns_server is defined
        - provision_dns_server != ""
        - not safe_mode | default(true)

    # STEP 4 — CONFIGURATION
    - name: Deploy config file
      include_tasks: ../primitives/copy_file.yml
      vars:
        src: "{{ provision_config_src | default('/etc/hosts') }}"
        dest: "{{ provision_config_dest | default('/tmp/hosts_backup') }}"

    - name: Modify config file
      include_tasks: ../primitives/modify_file.yml
      vars:
        file_path: "{{ provision_file_path | default('/tmp/test_config') }}"
        content: "{{ provision_file_content | default('configured=true') }}"

    # STEP 5 — BASELINE COMMAND
    - name: Run baseline command
      include_tasks: ../primitives/run_command.yml
      vars:
        cmd: "{{ provision_command | default('echo Provisioning done on $(hostname)') }}"
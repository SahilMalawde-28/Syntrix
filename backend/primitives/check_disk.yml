- name: Domain 4 - Check Disk Usage
  hosts: all
  gather_facts: yes  # Explicitly gather facts so ansible_os_family works reliably

  tasks:
    # --- Linux Execution Path ---
    - name: Run df -h command (Linux)
      command: df -h /
      register: linux_disk
      when: ansible_os_family | default('') != "Windows"

    # --- Windows Execution Path ---
    - name: Run disk check (Windows)
      win_shell: Get-Volume | Select-Object DriveLetter, FriendlyName, @{Name="SizeGB";Expression={[math]::Round($_.Size/1GB, 2)}}, @{Name="FreeGB";Expression={[math]::Round($_.SizeRemaining/1GB, 2)}} | ConvertTo-Json
      register: windows_disk
      when: ansible_os_family | default('') == "Windows"

    # --- Unified Output Layer ---
    - name: Show the output (Linux)
      debug:
        msg: "{{ linux_disk.stdout_lines }}"
      when: 
        - ansible_os_family | default('') != "Windows"
        - linux_disk is defined and linux_disk.stdout_lines is defined

    - name: Show the output (Windows)
      debug:
        msg: "{{ windows_disk.stdout_lines }}"
      when: 
        - ansible_os_family | default('') == "Windows"
        - windows_disk is defined and windows_disk.stdout_lines is defined
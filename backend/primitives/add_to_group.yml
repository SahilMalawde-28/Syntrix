- name: Add user to group on Linux
  ansible.builtin.user:
    name: "{{ user }}"
    groups: "{{ group }}"
    append: yes
  become: yes
  when: ansible_os_family != "Windows"

- name: Add user to group on Windows
  ansible.windows.win_user:
    name: "{{ user }}"
    groups:
      - "{{ group }}"
  when: ansible_os_family == "Windows"
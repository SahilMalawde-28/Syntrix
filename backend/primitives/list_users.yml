- name: List users
  hosts: all

  tasks:
    # --- Linux Side ---
    - name: Linux users
      # UIDs >= 1000 are standard human accounts; excludes 'nobody' (65534)
      shell: "getent passwd | awk -F: '$3 >= 1000 && $3 != 65534 {print $1}'"
      register: users_linux
      when: ansible_os_family != "Windows"

    - name: Display Linux Users
      debug:
        msg: "{{ users_linux.stdout_lines }}"
      when: ansible_os_family != "Windows"

    # --- Windows Side ---
    - name: Windows users
      win_shell: "Get-LocalUser | Where-Object { $_.Enabled -eq $true } | Select-Object -ExpandProperty Name"
      register: users_win
      when: ansible_os_family == "Windows"

    - name: Display Windows Users
      debug:
        msg: "{{ users_win.stdout_lines }}"
      when: ansible_os_family == "Windows"